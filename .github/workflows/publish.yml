# Publishes the package to npm when a version tag (v*) is pushed.
#
# Authorization: npm Trusted Publisher (OIDC) pointed at this repository and
# workflow file — or, as a fallback, an NPM_TOKEN repository secret. In both
# cases the npm token never touches a development machine.
name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # OIDC for npm provenance / trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing requires npm >= 11.5 (Node 22 ships npm 10)
      - run: npm install -g npm@latest

      - run: npm ci

      - run: npm run lint

      # The real gate: the same rules the post-publish scanner checks, but
      # run BEFORE publishing — the scanner exits 0 even when they fail.
      - run: npm run lint:community

      # Unit tests over the shared core (envelope, paging, drift, error
      # classification). No network: the HTTP exit is mocked.
      - run: npm test

      - run: npm run build

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Official n8n scanner — second net, checks provenance (which lint
      # cannot see). It is NOT the gate: it exits 0 even on lint findings,
      # which is why lint:community runs before publish above.
      # Pinned to the version just published: without it the scanner resolves
      # "latest", which seconds after publish is still the PREVIOUS release —
      # on v0.2.0 it scanned 0.1.4 and reported on the wrong package.
      - name: Scan published package
        run: npx @n8n/scan-community-package "n8n-nodes-nibo-empresas@${GITHUB_REF_NAME#v}"
