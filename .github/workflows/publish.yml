# Publishes the package to npm when a version tag (v*) is pushed.
#
# Authorization: npm Trusted Publisher (OIDC) pointed at this repository and
# workflow file — or, as a fallback, an NPM_TOKEN repository secret. In both
# cases the npm token never touches a development machine.
name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # OIDC for npm provenance / trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing requires npm >= 11.5 (Node 22 ships npm 10)
      - run: npm install -g npm@latest

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Official n8n scanner — keeps the package compatible with the
      # verification program without submitting to it.
      - name: Scan published package
        run: npx @n8n/scan-community-package n8n-nodes-nibo-empresas
