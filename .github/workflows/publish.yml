# Publishes the package to npm when a version tag (v*) is pushed.
#
# Authorization: npm Trusted Publisher (OIDC) pointed at this repository and
# workflow file — or, as a fallback, an NPM_TOKEN repository secret. In both
# cases the npm token never touches a development machine.
name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # OIDC for npm provenance / trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing requires npm >= 11.5 (Node 22 ships npm 10)
      - run: npm install -g npm@latest

      - run: npm ci

      - run: npm run lint

      # The real gate: the same rules the post-publish scanner checks, but
      # run BEFORE publishing — the scanner exits 0 even when they fail.
      - run: npm run lint:community

      # Unit tests over the shared core (envelope, paging, drift, error
      # classification). No network: the HTTP exit is mocked.
      - run: npm test

      - run: npm run build

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Official n8n scanner — second net, checks provenance (which lint
      # cannot see). It is NOT the publish gate: lint:community runs before
      # publish above, because by the time this step runs the package is out.
      # Pinned to the version just published: without it the scanner resolves
      # "latest", which seconds after publish is still the PREVIOUS release —
      # on v0.2.0 it scanned 0.1.4 and reported on the wrong package.
      #
      # Retried because the scan runs seconds after publish and depends on two
      # things that need a moment to settle: npm serving the new version, and
      # GitHub serving the source the provenance attests to (on v0.2.1 that
      # fetch answered 404, and the very same scan passed minutes later).
      #
      # The success LINE is what is checked, never the exit code. This tool
      # exits 0 whatever happens: on lint findings, and — measured on v0.6.0 —
      # when it fails to analyse the package at all (`Failed to analyze:
      # TypeError` out of its own dependency, on a runner forced onto Node 24).
      # That release went green here having scanned nothing; run by hand on
      # Node 22 the very same version passed clean. A step that cannot tell
      # "passed" from "never ran" guarantees nothing while looking like it does.
      - name: Scan published package
        run: |
          version="${GITHUB_REF_NAME#v}"
          package="n8n-nodes-nibo-empresas@$version"
          for delay in 20 40 60; do
            sleep "$delay"
            output="$(npx @n8n/scan-community-package "$package" 2>&1 || true)"
            echo "$output"
            if grep -qF 'has passed all security checks' <<<"$output"; then
              exit 0
            fi
            echo "::notice::scan not conclusive yet — retrying"
          done
          echo "::error::the official scan never said $package passed. Either it found something or it could not analyse the package — the output above says which. Run 'npx @n8n/scan-community-package $package' by hand before trusting this release."
          exit 1
