# Publishes the package to npm when a version tag (v*) is pushed.
#
# Authorization: npm Trusted Publisher (OIDC) pointed at this repository and
# workflow file — or, as a fallback, an NPM_TOKEN repository secret. In both
# cases the npm token never touches a development machine.
name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # OIDC for npm provenance / trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing requires npm >= 11.5 (Node 22 ships npm 10)
      - run: npm install -g npm@latest

      - run: npm ci

      - run: npm run lint

      # The real gate: the same rules the post-publish scanner checks, but
      # run BEFORE publishing — the scanner exits 0 even when they fail.
      - run: npm run lint:community

      # Unit tests over the shared core (envelope, paging, drift, error
      # classification). No network: the HTTP exit is mocked.
      - run: npm test

      - run: npm run build

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Official n8n scanner — second net, checks provenance (which lint
      # cannot see). It is NOT the publish gate: lint:community runs before
      # publish above, because by the time this step runs the package is out.
      # Pinned to the version just published: without it the scanner resolves
      # "latest", which seconds after publish is still the PREVIOUS release —
      # on v0.2.0 it scanned 0.1.4 and reported on the wrong package.
      #
      # Retried because the scan runs seconds after publish and depends on two
      # things that need a moment to settle: npm serving the new version, and
      # GitHub serving the source the provenance attests to (on v0.2.1 that
      # fetch answered 404, and the very same scan passed minutes later).
      #
      # The success LINE is what is checked, never the exit code. This tool
      # exits 0 whatever happens: on lint findings, and when it fails to analyse
      # the package at all. So the three outcomes are told apart by what it
      # printed, and only one of them is this release's problem.
      #
      # `legacy-peer-deps` is turned off for this step alone, and that is the
      # whole of the red cross every release wore from v0.6.0 to v0.11.1. `npx`
      # installs the scanner into a throwaway tree, and that install reads the
      # project .npmrc sitting in the working directory, where the flag is on
      # for our own two eslint majors. With it on, npm installs no peer at all,
      # so the only typescript in the tree is the scanner's own pinned 7.0.2 —
      # and its @typescript-eslint/parser accepts `>=4.8.4 <6.1.0`, reads
      # `ts.Extension` off `undefined` and dies with `Cannot read properties of
      # undefined (reading 'Cjs')`. With it off, npm hoists the peer-satisfying
      # typescript 6.0.3 and nests the 7.0.2, and the very same scan passes.
      # Measured on 2026-07-27 against v0.11.1, one variable at a time, in a
      # container of the runner's own image: on with the flag, off without it.
      # Nothing else in the job changes — `npm ci` still installs under the flag,
      # which is what it is there for.
      - name: Scan published package
        env:
          npm_config_legacy_peer_deps: 'false'
        run: |
          version="${GITHUB_REF_NAME#v}"
          package="n8n-nodes-nibo-empresas@$version"
          last=""
          for delay in 20 40 60; do
            sleep "$delay"
            output="$(npx @n8n/scan-community-package "$package" 2>&1 || true)"
            echo "$output"
            if grep -qF 'has passed all security checks' <<<"$output"; then
              exit 0
            fi
            last="$output"
            echo "::notice::scan not conclusive yet — retrying"
          done
          # Every attempt is retried, whatever it said — the 404 of v0.2.1 came
          # out of GitHub and not out of this package, and the next attempt
          # passed. Only the last word is classified, and only one classification
          # is about the package.
          if grep -qE 'Failed to analyze|Analysis failed' <<<"$last"; then
            echo "::warning::the official scan never managed to analyse $package: it broke on itself every time, and the output above is its own stack trace rather than a finding against this package. The gate that runs before publishing — lint:community, the same rules — did pass. Check by hand with 'npx @n8n/scan-community-package $package', and if it breaks there too the flag above is the first thing to look at."
            exit 0
          fi
          echo "::error::the official scan never said $package passed, and it did analyse it — so the output above is about this package. It is already published: withdraw it or fix it forward."
          exit 1
